name = "gonews-tiktok-auth"
main = "src/index.js"
compatibility_date = "2026-10-14"
workers_dev = true

# Bind to the existing Cloudflare Workers KV namespace GONEWS_AUTH.
# This namespace ID is not a secret; sensitive TikTok keys, tokens and
# encryption passwords must be configured as Cloudflare Worker secrets.
[[kv_namespaces]]
binding = "AUTH_STORE"
id = "c905d4b16d26451aa7eb6200ff5a782a"

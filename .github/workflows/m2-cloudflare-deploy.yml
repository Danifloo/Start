name: Deploy M2 Publisher to Cloudflare Free

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: m2-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-publisher
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment authorization
        env:
          ADMIN_PASSWORD: ${{ secrets.M2_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.M2_SESSION_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as private GitHub Actions secrets."
            exit 1
          fi
          if [ "$(printf '%s' "$ADMIN_PASSWORD" | wc -c)" -lt 16 ] || [ "$(printf '%s' "$SESSION_SECRET" | wc -c)" -lt 32 ]; then
            echo "::error::Set M2_ADMIN_PASSWORD (16+ chars) and M2_SESSION_SECRET (32+ chars) in private GitHub Actions secrets."
            exit 1
          fi
      - name: Install Wrangler CLI
        run: npm install --no-audit --no-fund
      - name: Test app
        run: npm run check
      - name: Create/reuse D1 and prepare production configuration
        run: node scripts/prepare-config.mjs
      - name: Initialize database safely
        run: npx wrangler d1 execute m2-publisher-db --remote --file=./schema.sql --yes
      - name: Deploy Worker with Instagram publishing disabled
        run: npx wrangler deploy --config ./wrangler.toml
      - name: Set private admin password (not saved in repository)
        env:
          PRIVATE_SECRET: ${{ secrets.M2_ADMIN_PASSWORD }}
        run: printf '%s' "$PRIVATE_SECRET" | npx wrangler secret put ADMIN_PASSWORD --name m2-publisher
      - name: Set private session signing key (not saved in repository)
        env:
          PRIVATE_SECRET: ${{ secrets.M2_SESSION_SECRET }}
        run: printf '%s' "$PRIVATE_SECRET" | npx wrangler secret put SESSION_SECRET --name m2-publisher
      - name: Finished
        run: echo "Worker deployed with PUBLISHING_ENABLED=false. Open Cloudflare Workers dashboard to obtain its URL. No Instagram posts have been sent."

name: M2 Publisher Cloudflare checks
on:
  push:
    branches: [feature/m2-publisher, feature/m2-publisher-cloudflare]
    paths:
      - 'm2-publisher/cloudflare/**'
      - '.github/workflows/m2-publisher-cloudflare-checks.yml'
  pull_request:
    paths:
      - 'm2-publisher/cloudflare/**'
      - '.github/workflows/m2-publisher-cloudflare-checks.yml'
permissions:
  contents: read
jobs:
  node-and-sql-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m2-publisher/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax checks
        run: npm run check
      - name: API, auth, slot and limit tests
        run: npm test
      - name: D1 schema test
        run: python3 test/schema_test.py
